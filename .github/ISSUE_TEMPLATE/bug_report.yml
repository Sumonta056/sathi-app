name: Bug report
description: Something in Sathi does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Water
        2. Set the interval to 30 min
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sathi version
      description: The version shows at the bottom of the menu bar popover.
      placeholder: "2.0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Optional. Remove your name or other private data first.
