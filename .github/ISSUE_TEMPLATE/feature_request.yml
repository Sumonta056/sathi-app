name: Feature request
description: Suggest a new buddy, setting, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that Sathi does not help with now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Sathi help? A sketch or an example is welcome.
