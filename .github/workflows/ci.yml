name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - run: ./scripts/lint.sh

  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - run: ./scripts/test.sh
      - name: Release build
        run: swift build -c release

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check site files
        run: ./scripts/check-site.sh
