name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Info.plist
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG does not match CFBundleShortVersionString $APP"
            exit 1
          fi
          echo "VERSION=$APP" >> "$GITHUB_ENV"

      - name: Check CHANGELOG has this version
        run: grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      - run: ./scripts/test.sh

      - name: Build the DMG
        run: ./scripts/make-dmg.sh

      - name: Release notes from CHANGELOG
        run: awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "build/Sathi-$VERSION.dmg" build/Sathi.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" "build/Sathi-$VERSION.dmg" build/Sathi.dmg \
              --title "Sathi $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
