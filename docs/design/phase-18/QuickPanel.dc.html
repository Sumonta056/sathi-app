<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 620px; box-sizing: border-box; background: #121826; border: 1px solid #263049; border-radius: 14px; font-family: Figtree, system-ui, sans-serif; color: #EEF2FA; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <span style="font-weight: 800; font-size: 16px;">Sathi</span>
    <span style="font-size: 12px; color: #9AA6BF;">Tue 14:52</span>
  </div>

  <div style="background: #2E1A1C; border: 1px solid #4A2A2C; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #FF8A80;">NOW · 42m</span>
      <span style="font-size: 14px; font-weight: 700;">Code review · Sathi tracker PR</span>
    </div>
    <button style="font: inherit; font-size: 12px; font-weight: 700; color: #2A0E0C; background: #FF8A80; border: 0; border-radius: 8px; padding: 0 10px; height: 30px;">Switch</button>
  </div>

  <div style="display: flex; flex-direction: column; background: #1A2233; border: 1px solid #263049; border-radius: 12px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #222B40;">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #4CC3F5;"></span><span style="flex: 1; font-size: 14px; font-weight: 600;">Fota</span><span style="font-size: 13px; color: #9AA6BF;">5 / 8</span>
      <button style="font: inherit; font-size: 12px; color: #4CC3F5; background: transparent; border: 1px solid #263049; border-radius: 8px; height: 28px; padding: 0 10px;">+1 glass</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #222B40;">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #F2A64A;"></span><span style="flex: 1; font-size: 14px; font-weight: 600;">Boi</span><span style="font-size: 13px; color: #5FD39A;">✓ Goal met</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #222B40;">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #A99CF5;"></span><span style="flex: 1; font-size: 14px; font-weight: 600;">Shanti</span><span style="font-size: 13px; color: #9AA6BF;">16:00</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px;">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #CDEF5A;"></span><span style="flex: 1; font-size: 14px; font-weight: 600;">Shokti</span><span style="font-size: 13px; color: #9AA6BF;">10 / 20 min</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <button style="font: inherit; font-size: 13px; font-weight: 600; color: #EEF2FA; background: #1A2233; border: 1px solid #263049; border-radius: 10px; height: 44px;">Quick reminder</button>
    <button style="font: inherit; font-size: 13px; font-weight: 600; color: #EEF2FA; background: #1A2233; border: 1px solid #263049; border-radius: 10px; height: 44px;">Take a break</button>
  </div>

  <div style="flex: 1;"></div>

  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px; background: #4CC3F5; color: #0D1220; font-weight: 800; font-size: 15px; text-decoration: none;">Open Sathi</a>
  <div style="display: flex; justify-content: space-between; font-size: 13px;">
    <a href="Reports.dc.html" style="color: #9AA6BF; text-decoration: none;">Reports</a>
    <a href="Settings.dc.html" style="color: #9AA6BF; text-decoration: none;">Settings</a>
    <a href="#" style="color: #9AA6BF; text-decoration: none;">Quit</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":620}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
