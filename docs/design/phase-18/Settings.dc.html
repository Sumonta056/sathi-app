    <section aria-label="Level" style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; color: #8C99B3; font-weight: 600;">How firm is Fota?</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
